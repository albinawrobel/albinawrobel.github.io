<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Each round, the plan drifts further from the real buyer" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="760" height="200" fill="#FFFFFF"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#12161A"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="700" fill="#12161A">Each round, the plan drifts further from the real buyer</text><g fill="none" stroke="#12161A" stroke-width="1.5"><path d="M172.0 96H204.0" marker-end="url(#a2)"/><path d="M352.0 96H384.0" marker-end="url(#a2)"/><path d="M532.0 96H564.0" marker-end="url(#a2)"/><path d="M638 132V172H278V132" marker-end="url(#a2)"/></g><rect x="24.0" y="60" width="148" height="72" rx="10" fill="#C86D51" fill-opacity="0.18" stroke="#C86D51" stroke-width="2.5"/><text x="98" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Real buyers</text><text x="98" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">what they actually</text><text x="98" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">need and do</text><rect x="204.0" y="60" width="148" height="72" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#12161A" stroke-width="1.5"/><text x="278" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Your summary</text><text x="278" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">what you noticed,</text><text x="278" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">remembered, hoped</text><rect x="384.0" y="60" width="148" height="72" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#12161A" stroke-width="1.5"/><text x="458" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Mentor’s advice</text><text x="458" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">based only on</text><text x="458" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">your summary</text><rect x="564.0" y="60" width="148" height="72" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#12161A" stroke-width="1.5"/><text x="638" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Next revision</text><text x="638" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">carries both</text><text x="638" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">sets of assumptions</text><text x="458" y="164" text-anchor="middle" font-size="11.5" fill="#4E5862">round after round, never back to the buyer</text></svg>