<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" role="img" aria-label="With the market in the loop, every round adds real data" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
