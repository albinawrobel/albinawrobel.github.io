<text x="24" y="32" font-size="15" font-weight="700" fill="#12161A">With the market in the loop, every round adds real data</text><g fill="none" stroke="#12161A" stroke-width="1.5"><path d="M172.0 96H204.0" marker-end="url(#a3)"/><path d="M352.0 96H384.0" marker-end="url(#a3)"/><path d="M532.0 96H564.0" marker-end="url(#a3)"/><path d="M638 132V168H98V132" marker-end="url(#a3)"/></g><rect x="24.0" y="60" width="148" height="72" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#12161A" stroke-width="1.5"/><text x="98" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Your plan</text><text x="98" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">a hypothesis,</text><text x="98" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">not a promise</text><rect x="204.0" y="60" width="148" height="72" rx="10" fill="#7BA4B5" fill-opacity="0.18" stroke="#7BA4B5" stroke-width="2.5"/><text x="278" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Test with buyers</text><text x="278" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">the test that fits</text><text x="278" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">your market</text><rect x="384.0" y="60" width="148" height="72" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#12161A" stroke-width="1.5"/><text x="458" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Real results</text><text x="458" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">commitments,</text><text x="458" y="120" text-anchor="middle" font-size="11.5" fill="#4E5862">not compliments</text><rect x="564.0" y="60" width="148" height="72" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#12161A" stroke-width="1.5"/><text x="638" y="84" text-anchor="middle" font-weight="700" fill="#12161A">Mentor reviews</text><text x="638" y="104" text-anchor="middle" font-size="11.5" fill="#4E5862">interprets the</text><text x="638" y="120" text-anchor="middle" font-size="11.5" fill="#4E58