# ============================================================
#  YOUR SITE SETTINGS — edit the lines marked with  <-- EDIT
#  After saving, GitHub rebuilds your site in about a minute.
# ============================================================

title: "Albina Wrobel"
tagline: "Growth marketer helping tech startups go to market"
description: >-   # 1–2 sentences. Google shows this in search results.
  Albina Wrobel is a growth marketer who helps new founders take their startups to market
  and find out if there's real demand for what they've built. Free, open-source GTM resources
  and hands-on help, no marketing experience needed.

url: "https://albinawrobel.github.io"   # Later, swap in your own domain.
baseurl: ""

author:
  name: "Albina Wrobel"
  email: "wrobelalbina@gmail.com"

# Contact & social links. Leave a line as "" to hide it.
booking_url: ""                          # add a Cal.com / Calendly link later
phone: ""                                # optional — we suggest leaving this blank
linkedin: ""                             # add your LinkedIn URL later
github: "albinawrobel"
twitter: ""                              # optional, e.g. yourhandle (no @)

# Google Search Console: paste ONLY the code from your verification tag between the quotes.
# Example tag: <meta name="google-site-verification" content="abc123" />  ->  google: "abc123"
webmaster_verifications:
  google: ""                             # <-- EDIT

# Tracking. Paste each ID between the quotes. Leave "" to switch that tool off.
ga4_id: "G-WZ3RKPBN3M"                               # <-- EDIT  Google Analytics "Measurement ID", looks like G-ABC123XYZ
clarity_id: "zkj47w722l"                           # <-- EDIT  Microsoft Clarity "Project ID", looks like k8x2abc9de

# ---------- You can leave everything below alone ----------
lang: en
timezone: America/Toronto
permalink: /resources/:title/
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/share.png   # the preview picture when a link is shared
social:
  name: "Albina Wrobel"
exclude:
  - README.md
  - HOW-TO-EDIT.md
  - about.md       # About page removed; everything lives on the home page
  - tools          # calculators are hidden for now; delete this line to bring them back
