title: "Your Name"                       # <-- EDIT: your full name (this is your brand)
tagline: "Growth marketing & go-to-market for tech startups"   # <-- EDIT
description: >-                          # <-- EDIT: 1–2 sentences. Google shows this in search results.
  Free, open-source resources on growth marketing and go-to-market strategy
  for tech startups — the common traps, how to avoid them, and simple tools
  to run the numbers.

url: "https://albinawrobel.github.io"   # Later, swap in your own domain.
