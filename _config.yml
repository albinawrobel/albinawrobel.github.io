author:
  name: "Your Name"                      # <-- EDIT
  email: "you@example.com"               # <-- EDIT: email shown on your contact page

# Contact & social links. Leave a line as "" to hide it.
booking_url: "https://cal.com/yourname"  # <-- EDIT: Cal.com or Calendly link
